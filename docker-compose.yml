
services:

  mysql:
    image: mysql:8.0
    container_name: db_clockify_mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: pm_timesheet_evm
      MYSQL_USER: bdt_user
      MYSQL_PASSWORD: bdt_user
    ports:
      - "3306:3306"       
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bdt_user", "-pbdt_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bdt_dotnet
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-7100}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      AllowedOrigins: ${AllowedOrigins:-http://localhost:3001}
      ConnectionStrings__Default: ${DB_CONNECTION_STRING}
      Clockify__ApiKey: ${CLOCKIFY_API_KEY}
      Clockify__WorkspaceId: ${CLOCKIFY_WORKSPACE_ID}
      Clockify__UserId: ${CLOCKIFY_USER_ID}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
